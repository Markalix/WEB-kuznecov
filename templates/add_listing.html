{% extends "base.html" %}

{% block title %}Добавить объявление{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Добавить объявление</h4>
            </div>
            <div class="card-body">
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                {% if message %}
                    <div class="alert alert-success">{{ message }}</div>
                {% endif %}

                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label">Название товара</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Описание</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">Цена (₽)</label>
                        <input type="number" class="form-control" id="price" name="price" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="image" class="form-label">Фото товара</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        <div class="form-text">Поддерживаемые форматы: PNG, JPG, JPEG, GIF, WEBP (макс. 16MB)</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-cloud-upload"></i> Разместить объявление
                    </button>

                    <a href="/profile" class="btn btn-outline-secondary w-100 mt-2">
                        Вернуться в профиль
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
