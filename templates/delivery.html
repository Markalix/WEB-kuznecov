{% extends "base.html" %}

{% block title %}Оформление заказа{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-truck"></i> Оформление доставки</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i>
                    <strong>Сумма заказа: {{ total }} ₽</strong><br>
                    <small>Доставка бесплатно! Ожидаемое время: 3 дня</small>
                </div>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="delivery_address" class="form-label">
                            <i class="bi bi-geo-alt"></i> Адрес доставки
                        </label>
                        <textarea class="form-control" id="delivery_address" name="delivery_address"
                                  rows="3" placeholder="Город, улица, дом, квартира, индекс" required></textarea>
                        <div class="form-text">Укажите точный адрес для доставки</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2">
                        <i class="bi bi-credit-card"></i> Подтвердить и оплатить {{ total }} ₽
                    </button>

                    <a href="/cart" class="btn btn-outline-secondary w-100 mt-2">
                        ← Вернуться в корзину
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
