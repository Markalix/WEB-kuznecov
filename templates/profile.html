{% extends "base.html" %}

{% block content %}
<div class="profile-info">
    <h2>Личный кабинет</h2>

    <div class="profile-field">
        <label>Имя:</label>
        <span>{{ user.username }}</span>
    </div>

    <div class="profile-field">
        <label>Email:</label>
        <span>{{ user.email }}</span>
    </div>

    <div class="profile-field">
        <label>Дата регистрации:</label>
        <span>{{ user.created_at.strftime('%d.%m.%Y') }}</span>
    </div>
</div>
{% endblock %}
