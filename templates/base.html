<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Интернет-магазин{% endblock %}</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">Главная</a>
            <a href="/profile">Профиль</a>
            <a href="/session-info">Сессия</a>

            {% if session and session.user_id %}
                <div class="user-info">
                    <span>Привет, <span class="user-name">{{ session.username }}</span>!</span>
                    <a href="/logout" class="logout-btn">Выйти</a>
                </div>
            {% else %}
                <div class="user-info">
                    <a href="/login">Войти</a>
                    <a href="/register">Зарегистироваться</a>
                </div>
            {% endif %}
        </div>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
