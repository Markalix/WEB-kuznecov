{% extends "base.html" %}

{% block content %}
    {% if session and session.user_id %}
        <h1>С возвращением, {{ session.username }}!</h1>
        <p>Вы вошли: {{ session.login_time }}</p>
    {% else %}
        <h1>Добро пожаловать!</h1>
        <p><a href="/login">Войти</a> <a href="/register">Зарегестрироваться</a></p>
    {% endif %}
{% endblock %}
